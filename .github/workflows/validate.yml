name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: "validate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: node
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: "${{ steps.modules.outputs.cache-hit != 'true' }}"
        run: npm ci
      - run: npm run validate:schema

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: node
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: "${{ steps.modules.outputs.cache-hit != 'true' }}"
        run: npm ci
      - run: npm run validate

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: node
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: "${{ steps.modules.outputs.cache-hit != 'true' }}"
        run: npm ci
      - run: npm test

name: publish

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.github/workflows/publish.yml'
      - 'scripts/publish.mjs'
  workflow_dispatch:

concurrency:
  group: "publish-main"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: "${{ github.ref == 'refs/heads/main' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: node
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: "${{ steps.modules.outputs.cache-hit != 'true' }}"
        run: npm ci

      - name: Validate before publishing
        run: |
          npm run validate:schema
          npm run validate

      - name: Publish to production
        env:
          PLUGIN_PUBLISH_URL: ${{ secrets.PLUGIN_PUBLISH_URL }}
          PLUGIN_PUBLISH_TOKEN: ${{ secrets.PLUGIN_PUBLISH_TOKEN }}
        run: npm run publish:prod
